apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: dora-art11-require-resource-limits
  annotations:
    dora.article: "11(1)"
    dora.requirement: "REQ-006"
    dora.requirement-text: "Ensure ICT system resilience through resource governance"
    dora.coverage: "fully-automatable"
    # Match Pod only. Kyverno autogen derives the controller rules automatically,
    # rewriting spec.* to spec.template.spec.* for each kind listed below.
    # Listing controllers in match.kinds DISABLES autogen and applies the
    # pod-level path literally to the controller object, where it does not exist.
    pod-policies.kyverno.io/autogen-controllers: "Deployment,StatefulSet,DaemonSet,Job,CronJob"
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-requests-and-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kyverno
                - gatekeeper-system
                - argocd
      validate:
        message: >-
          DORA Art. 11(1) violation [REQ-006]: All containers must specify
          resources.requests (cpu, memory) AND resources.limits (cpu, memory).
          Unbounded resource usage risks denial of service.
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
                    cpu: "?*"
