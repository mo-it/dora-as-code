apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: dora-art9-require-sealed-secrets
  annotations:
    dora.article: "9(4)(d)"
    dora.requirement: "REQ-023"
    dora.requirement-text: "Implement cryptographic key management controls"
    dora.coverage: "partially-automatable"
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: block-plain-opaque-secrets
      match:
        any:
          - resources:
              kinds:
                - Secret
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kyverno
                - gatekeeper-system
                - argocd
          # Allow Secrets that are managed by approved tools
          - resources:
              selector:
                matchLabels:
                  sealedsecrets.bitnami.com/managed: "true"
          - resources:
              selector:
                matchLabels:
                  external-secrets.io/managed: "true"
      validate:
        message: >-
          DORA Art. 9(4)(d) violation [REQ-023]: Plain Kubernetes Secrets
          (type: Opaque) are not permitted. Use SealedSecrets or
          external-secrets-operator for proper cryptographic key management.
          Add label sealedsecrets.bitnami.com/managed: "true" or
          external-secrets.io/managed: "true" for approved secrets.
        deny:
          conditions:
            all:
              - key: "{{ request.object.type }}"
                operator: Equals
                value: "Opaque"
