apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: dora-art9-require-security-hardening
  annotations:
    dora.article: "9(4)(a)"
    dora.requirement: "REQ-018"
    dora.requirement-text: "Enforce security hardening on container filesystems"
    dora.coverage: "fully-automatable"
    # Match Pod only. Kyverno autogen derives the controller rules automatically,
    # rewriting spec.* to spec.template.spec.* for each kind listed below.
    # Listing controllers in match.kinds DISABLES autogen and applies the
    # pod-level path literally to the controller object, where it does not exist.
    pod-policies.kyverno.io/autogen-controllers: "Deployment,StatefulSet,DaemonSet,Job,CronJob"
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-readonly-root-and-seccomp
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kyverno
                - gatekeeper-system
                - argocd
      validate:
        message: >-
          DORA Art. 9(4)(a) violation [REQ-018]: Containers must set
          readOnlyRootFilesystem: true, allowPrivilegeEscalation: false,
          and a seccomp profile (RuntimeDefault or Localhost).
        pattern:
          spec:
            containers:
              - securityContext:
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
                  seccompProfile:
                    type: "RuntimeDefault | Localhost"
