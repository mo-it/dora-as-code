apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: dora-art15-restrict-registries
  annotations:
    dora.article: "15(1)"
    dora.requirement: "REQ-023b"
    dora.requirement-text: "Restrict container images to pre-approved registries"
    dora.coverage: "fully-automatable"
    pod-policies.kyverno.io/autogen-controllers: "Deployment,StatefulSet,DaemonSet,Job,CronJob"
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: restrict-image-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kyverno
                - gatekeeper-system
                - argocd
      validate:
        message: >-
          DORA Art. 15(1) violation [REQ-023b]: Container images must
          come from approved registries. Allowed: docker.io/library/*,
          ghcr.io/*, registry.k8s.io/*, quay.io/*.
          Blocked: unqualified images and unknown registries.
        pattern:
          spec:
            containers:
              # Kyverno patterns treat "|" as OR, and autogen rewrites the
              # spec.containers path for controller kinds. The previous version
              # used a deny rule keyed on
              #   {{ request.object.spec.containers[].image }}
              # which autogen does NOT rewrite -- JMESPath strings are opaque to
              # it -- so on a Deployment the expression resolved to nothing and
              # the rule never denied. Expressing this as a pattern restores
              # controller coverage.
              - image: "docker.io/library/* | ghcr.io/* | registry.k8s.io/* | quay.io/* | nginx:* | reg.kyverno.io/*"
