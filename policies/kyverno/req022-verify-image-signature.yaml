apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: dora-art15-verify-image-signature
  annotations:
    dora.article: "15(1)"
    dora.requirement: "REQ-022"
    dora.requirement-text: "Verify container image provenance and integrity"
    dora.coverage: "fully-automatable"
    dora.expressiveness-note: >-
      Kyverno has native verifyImages rule type for cryptographic
      signature verification (Cosign/Notary/SLSA). This policy uses
      an annotation-check fallback for lab testing without a signing
      key pair. In production, replace with verifyImages + real key.
      Gatekeeper has NO equivalent native capability.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-image-signature-annotation
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kyverno
                - gatekeeper-system
                - argocd
      validate:
        message: >-
          DORA Art. 15(1) violation [REQ-022]: Container images must
          be signed. Add annotation dora.io/image-signature-verified: "true".
          NOTE: Kyverno supports native verifyImages for cryptographic
          verification; this annotation check is a lab-mode fallback.
        pattern:
          metadata:
            annotations:
              dora.io/image-signature-verified: "true"
