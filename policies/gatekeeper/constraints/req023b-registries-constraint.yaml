apiVersion: constraints.gatekeeper.sh/v1beta1
kind: DoraRegistries
metadata:
  name: dora-art15-restrict-registries
  annotations:
    dora.article: "15(1)"
    dora.requirement: "REQ-023b"
    dora.coverage: "fully-automatable"
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet"]
    excludedNamespaces:
      - kube-system
      - kube-public
      - gatekeeper-system
      - kyverno
      - argocd
  parameters:
    allowedRegistries:
      - "docker.io/library/"
      - "ghcr.io/"
      - "registry.k8s.io/"
      - "quay.io/"
      - "reg.kyverno.io/"
