apiVersion: constraints.gatekeeper.sh/v1beta1
kind: DoraDescription
metadata:
  name: dora-art5-require-description
  annotations:
    dora.article: "5(2)(d)"
    dora.requirement: "REQ-025"
    dora.coverage: "partially-automatable"
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet"]
      - apiGroups: [""]
        kinds: ["Service"]
    excludedNamespaces:
      - kube-system
      - kube-public
      - gatekeeper-system
      - kyverno
      - argocd
