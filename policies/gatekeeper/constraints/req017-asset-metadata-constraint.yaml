apiVersion: constraints.gatekeeper.sh/v1beta1
kind: DoraAssetMetadata
metadata:
  name: dora-art8-require-asset-metadata
  annotations:
    dora.article: "8(1)"
    dora.requirement: "REQ-017"
    dora.coverage: "partially-automatable"
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet"]
    excludedNamespaces:
      - kube-system
      - kube-public
      - gatekeeper-system
      - kyverno
      - argocd
  parameters:
    requiredAnnotations:
      - "dora.io/business-function"
      - "dora.io/data-classification"
      - "dora.io/asset-owner"
