apiVersion: constraints.gatekeeper.sh/v1beta1
kind: DoraResourceLimits
metadata:
  name: dora-art11-require-resource-limits
  annotations:
    dora.article: "11(1)"
    dora.requirement: "REQ-006"
    dora.coverage: "fully-automatable"
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet"]
    excludedNamespaces:
      - kube-system
      - kube-public
      - gatekeeper-system
      - kyverno
      - argocd
