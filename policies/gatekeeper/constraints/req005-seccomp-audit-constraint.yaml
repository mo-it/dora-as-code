apiVersion: constraints.gatekeeper.sh/v1beta1
kind: DoraSeccompAudit
metadata:
  name: dora-art10-require-kernel-audit
  annotations:
    dora.article: "10(1)"
    dora.requirement: "REQ-005"
    dora.coverage: "partially-automatable"
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet"]
    excludedNamespaces:
      - kube-system
      - kube-public
      - gatekeeper-system
      - kyverno
      - argocd
