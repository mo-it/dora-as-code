apiVersion: constraints.gatekeeper.sh/v1beta1
kind: DoraSecurityContext
metadata:
  name: dora-art9-require-security-hardening
  annotations:
    dora.article: "9(4)(a)"
    dora.requirement: "REQ-018"
    dora.coverage: "fully-automatable"
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet"]
    excludedNamespaces:
      - kube-system
      - kube-public
      - gatekeeper-system
      - kyverno
      - argocd
