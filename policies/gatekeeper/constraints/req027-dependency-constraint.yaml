apiVersion: constraints.gatekeeper.sh/v1beta1
kind: DoraDependency
metadata:
  name: dora-art6-require-dependency
  annotations:
    dora.article: "6(2)"
    dora.requirement: "REQ-027"
    dora.coverage: "partially-automatable"
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet"]
      - apiGroups: [""]
        kinds: ["Service"]
    excludedNamespaces:
      - kube-system
      - kube-public
      - gatekeeper-system
      - kyverno
      - argocd
