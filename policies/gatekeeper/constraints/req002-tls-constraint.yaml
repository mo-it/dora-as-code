apiVersion: constraints.gatekeeper.sh/v1beta1
kind: DoraTls
metadata:
  name: dora-art9-require-tls
  annotations:
    dora.article: "9(2)"
    dora.requirement: "REQ-002"
    dora.coverage: "fully-automatable"
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["networking.k8s.io"]
        kinds: ["Ingress"]
    excludedNamespaces:
      - kube-system
      - kube-public
      - gatekeeper-system
      - kyverno
      - argocd
