apiVersion: constraints.gatekeeper.sh/v1beta1
kind: DoraAuthTimeout
metadata:
  name: dora-art9-require-auth-timeout
  annotations:
    dora.article: "9(4)(c)"
    dora.requirement: "REQ-026"
    dora.coverage: "partially-automatable"
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["networking.k8s.io"]
        kinds: ["Ingress"]
    excludedNamespaces:
      - kube-system
      - kube-public
      - gatekeeper-system
      - kyverno
      - argocd
