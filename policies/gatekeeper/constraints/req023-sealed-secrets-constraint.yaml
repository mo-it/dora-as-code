apiVersion: constraints.gatekeeper.sh/v1beta1
kind: DoraSealedSecrets
metadata:
  name: dora-art9-require-sealed-secrets
  annotations:
    dora.article: "9(4)(d)"
    dora.requirement: "REQ-023"
    dora.coverage: "partially-automatable"
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Secret"]
    excludedNamespaces:
      - kube-system
      - kube-public
      - gatekeeper-system
      - kyverno
      - argocd
  parameters:
    allowedLabels:
      - "sealedsecrets.bitnami.com/managed"
      - "external-secrets.io/managed"
