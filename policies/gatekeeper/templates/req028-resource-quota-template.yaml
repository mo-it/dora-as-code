apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: doraresourcequota
  annotations:
    dora.article: "9(3)(b)"
    dora.requirement: "REQ-028"
spec:
  crd:
    spec:
      names:
        kind: DoraResourceQuota
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package doraresourcequota

        violation[{"msg": msg}] {
          annotations := object.get(input.review.object.metadata, "annotations", {})
          not annotations["dora.io/resource-quota-configured"]
          msg := sprintf(
            "DORA Art. 9(3)(b) violation [REQ-028]: Namespace '%s' must have a ResourceQuota. Add annotation dora.io/resource-quota-configured: 'true' after creating one.",
            [input.review.object.metadata.name]
          )
        }
