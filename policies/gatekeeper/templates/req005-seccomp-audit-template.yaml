apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: doraseccompaudit
  annotations:
    dora.article: "10(1)"
    dora.requirement: "REQ-005"
spec:
  crd:
    spec:
      names:
        kind: DoraSeccompAudit
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package doraseccompaudit
        violation[{"msg": msg}] {
          annotations := object.get(input.review.object.metadata, "annotations", {})
          not annotations["dora.io/kernel-audit-enabled"]
          msg := sprintf(
            "DORA Art. 10(1) violation [REQ-005]: %s '%s' missing annotation dora.io/kernel-audit-enabled: 'true'.",
            [input.review.object.kind, input.review.object.metadata.name]
          )
        }
