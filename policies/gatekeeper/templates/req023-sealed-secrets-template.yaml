apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: dorasealedsecrets
  annotations:
    dora.article: "9(4)(d)"
    dora.requirement: "REQ-023"
spec:
  crd:
    spec:
      names:
        kind: DoraSealedSecrets
      validation:
        openAPIV3Schema:
          type: object
          properties:
            allowedLabels:
              type: array
              items:
                type: string
              description: "Labels that indicate the Secret is managed by an approved tool"
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package dorasealedsecrets

        violation[{"msg": msg}] {
          # Only check Opaque secrets (TLS certs, SA tokens etc. are OK)
          input.review.object.type == "Opaque"

          # Check if any of the allowed labels are present
          not has_approved_label

          msg := sprintf(
            "DORA Art. 9(4)(d) violation [REQ-023]: Secret '%s' is a plain Opaque Secret. Use SealedSecrets or external-secrets-operator. Add an approved management label.",
            [input.review.object.metadata.name]
          )
        }

        has_approved_label {
          labels := input.review.object.metadata.labels
          allowed := input.parameters.allowedLabels[_]
          labels[allowed]
        }
