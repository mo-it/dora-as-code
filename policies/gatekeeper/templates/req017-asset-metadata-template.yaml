apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: doraassetmetadata
  annotations:
    dora.article: "8(1)"
    dora.requirement: "REQ-017"
spec:
  crd:
    spec:
      names:
        kind: DoraAssetMetadata
      validation:
        openAPIV3Schema:
          type: object
          properties:
            requiredAnnotations:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package doraassetmetadata
        violation[{"msg": msg}] {
          required := input.parameters.requiredAnnotations[_]
          annotations := object.get(input.review.object.metadata, "annotations", {})
          not annotations[required]
          msg := sprintf(
            "DORA Art. 8(1) violation [REQ-017]: %s '%s' missing required annotation '%s'.",
            [input.review.object.kind, input.review.object.metadata.name, required]
          )
        }
