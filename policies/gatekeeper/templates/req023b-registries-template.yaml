apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  # MUST equal lowercase(spec.crd.spec.names.kind). A mismatch does not error:
  # Gatekeeper creates a SECOND template and leaves the original enforcing.
  name: doraregistries
  annotations:
    dora.article: "15(1)"
    dora.requirement: "REQ-023b"
    dora.fix: "v2 - resolves pod spec for controller kinds (was spec.containers only, silent on Deployments)"
spec:
  crd:
    spec:
      names:
        kind: DoraRegistries
      validation:
        openAPIV3Schema:
          type: object
          properties:
            allowedRegistries:
              type: array
              items:
                type: string
              description: "List of allowed registry prefixes"
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package doraregistries

        # ---------------------------------------------------------------------
        # Pod-spec resolution helpers
        # ---------------------------------------------------------------------
        # Gatekeeper has no equivalent of Kyverno's autogen, so every template
        # must resolve the pod spec itself. A bare Pod keeps its containers at
        # spec.containers; controllers nest them under spec.template.spec; a
        # CronJob nests them one level deeper again.
        #
        # These are PARTIAL SET rules on purpose. A body whose path does not
        # exist contributes nothing rather than erroring, so exactly one body
        # matches for any given object kind. Writing this as a complete rule
        # (:=) would risk a multiple-output error.
        #
        # NOTE: initContainers are deliberately NOT covered, to preserve exact
        # scope parity with the Kyverno pattern being compared against. This is
        # a documented limitation, not an oversight.

        pod_spec[s] {
          input.review.object.kind == "Pod"
          s := input.review.object.spec
        }
        pod_spec[s] {
          s := input.review.object.spec.template.spec
        }
        pod_spec[s] {
          s := input.review.object.spec.jobTemplate.spec.template.spec
        }

        containers[c] {
          spec := pod_spec[_]
          c := spec.containers[_]
        }

        violation[{"msg": msg}] {
          container := containers[_]
          not registry_allowed(container.image)
          msg := sprintf(
            "DORA Art. 15(1) violation [REQ-023b]: Container '%s' uses image '%s' from a non-approved registry.",
            [container.name, container.image]
          )
        }

        registry_allowed(image) {
          allowed := input.parameters.allowedRegistries[_]
          startswith(image, allowed)
        }

        # Short-form Docker Hub images (e.g. nginx:1.27) carry no registry prefix.
        registry_allowed(image) {
          not contains(image, "/")
        }
