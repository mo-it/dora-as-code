apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dora-kyverno-policies
  namespace: argocd
  annotations:
    # Wave 0: policies deploy FIRST, before any workloads
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    # UPDATE when pushed to GitHub:
    # repoURL: https://github.com/YOUR_USERNAME/dora-as-code.git
    repoURL: https://github.com/mo-it/dora-as-code.git
    targetRevision: HEAD
    path: policies/kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
