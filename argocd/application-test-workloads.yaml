apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dora-test-workloads
  namespace: argocd
  annotations:
    # Wave 1: workloads deploy AFTER policies are active
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/mo-it/dora-as-code.git
    targetRevision: HEAD
    path: manifests
    directory:
      recurse: true
      # Exclude two subtrees that this Application must not manage:
      #
      #   benchmark/     owned by the dora-bench-compliant Application. Two
      #                  Applications managing the same resources fight over
      #                  ownership and produce spurious OutOfSync churn.
      #
      #   non-compliant/ deliberately violates one policy each. With automated
      #                  sync these would retry and fail forever, burying real
      #                  failures in noise. They are applied on demand by the
      #                  detection sweep using kubectl --dry-run=server, which
      #                  traverses the identical admission path.
      exclude: '{benchmark/**,non-compliant/**}' 
  destination:
    server: https://kubernetes.default.svc
    namespace: dora-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
