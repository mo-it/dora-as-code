apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dora-gatekeeper-policies
  namespace: argocd
  annotations:
    # Wave 0: policies deploy FIRST
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    # UPDATE when pushed to GitHub:
    # repoURL: https://github.com/YOUR_USERNAME/dora-as-code.git
    repoURL: file:///home/mohit/dora-as-code
    targetRevision: HEAD
    path: policies/gatekeeper
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: gatekeeper-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
