s functions","coverage_tier":"partially-automatable"},"dora-art9-require-encrypted-storage":{"req_id":"REQ-001","dora_article":"Art. 9","dora_subsection":"9(2)","requirement_text":"Ensure confidentiality of data at rest","coverage_tier":"fully-automatable"},"doraencryptedstorageclass":{"req_id":"REQ-001","dora_article":"Art. 9","dora_subsection":"9(2)","requirement_text":"Ensure confidentiality of data at rest","coverage_tier":"fully-automatable"},"dora-art9-require-tls":{"req_id":"REQ-002","dora_article":"Art. 9","dora_subsection":"9(2)","requirement_text":"Ensure integrity and confidentiality of data in transit","coverage_tier":"fully-automatable"},"doratls":{"req_id":"REQ-002","dora_article":"Art. 9","dora_subsection":"9(2)","requirement_text":"Ensure integrity and confidentiality of data in transit","coverage_tier":"fully-automatable"},"dora-art9-require-image-tag":{"req_id":"REQ-009","dora_article":"Art. 9","dora_subsection":"9(2)","requirement_text":"Ensure data integrity through immutable container images","coverage_tier":"fully-automatable"},"doraimagetag":{"req_id":"REQ-009","dora_article":"Art. 9","dora_subsection":"9(2)","requirement_text":"Ensure data integrity through immutable container images","coverage_tier":"fully-automatable"},"dora-art9-require-resource-quota":{"req_id":"REQ-028","dora_article":"Art. 9","dora_subsection":"9(3)(b)","requirement_text":"Implement logical segregation of ICT assets","coverage_tier":"fully-automatable"},"doraresourcequota":{"req_id":"REQ-028","dora_article":"Art. 9","dora_subsection":"9(3)(b)","requirement_text":"Implement logical segregation of ICT assets","coverage_tier":"fully-automatable"},"dora-art9-require-non-root":{"req_id":"REQ-010","dora_article":"Art. 9","dora_subsection":"9(4)(a)","requirement_text":"Restrict container runtime privileges - non-root execution","coverage_tier":"fully-automatable"},"dorarunasnonroot":{"req_id":"REQ-010","dora_article":"Art. 9","dora_subsection":"9(4)(a)","requirement_text":"Restrict container runtime privileges - non-root execution","coverage_tier":"fully-automatable"},"dora-art9-block-privileged":{"req_id":"REQ-011","dora_article":"Art. 9","dora_subsection":"9(4)(a)","requirement_text":"Prevent container breakout - host isolation","coverage_tier":"fully-automatable"},"dorablockprivileged":{"req_id":"REQ-011","dora_article":"Art. 9","dora_subsection":"9(4)(a)","requirement_text":"Prevent container breakout - host isolation","coverage_tier":"fully-automatable"},"dora-art9-require-security-hardening":{"req_id":"REQ-018","dora_article":"Art. 9","dora_subsection":"9(4)(a)","requirement_text":"Enforce security hardening on container filesystems","coverage_tier":"fully-automatable"},"dorasecuritycontext":{"req_id":"REQ-018","dora_article":"Art. 9","dora_subsection":"9(4)(a)","requirement_text":"Enforce security hardening on container filesystems","coverage_tier":"fully-automatable"},"dora-art9-block-wildcard-rbac":{"req_id":"REQ-003","dora_article":"Art. 9","dora_subsection":"9(4)(b)","requirement_text":"Implement least-privilege access controls","coverage_tier":"fully-automatable"},"dorawildcardrbac":{"req_id":"REQ-003","dora_article":"Art. 9","dora_subsection":"9(4)(b)","requirement_text":"Implement least-privilege access controls","coverage_tier":"fully-automatable"},"dora-art9-block-cluster-admin-binding":{"req_id":"REQ-004","dora_article":"Art. 9","dora_subsection":"9(4)(b)","requirement_text":"Prevent privilege escalation through RBAC bindings","coverage_tier":"fully-automatable"},"doraclusteradmin":{"req_id":"REQ-004","dora_article":"Art. 9","dora_subsection":"9(4)(b)","requirement_text":"Prevent privilege escalation through RBAC bindings","coverage_tier":"fully-automatable"},"dora-art9-require-auth-timeout":{"req_id":"REQ-026","dora_article":"Art. 9","dora_subsection":"9(4)(c)","requirement_text":"Implement authentication and session management controls","coverage_tier":"partially-automatable"},"doraauthtimeout":{"req_id":"REQ-026","dora_article":"Art. 9","dora_subsection":"9(4)(c)","requirement_text":"Implement authentication and session management controls","coverage_tier":"partially-automatable"},"dora-art9-restrict-default-sa":{"req_id":"REQ-019","dora_article":"Art. 9","dora_subsection":"9(4)(c)","requirement_text":"Restrict access to ICT resources to authorised service accounts only","coverage_tier":"partially-automatable"},"doradefaultsa":{"req_id":"REQ-019","dora_article":"Art. 9","dora_subsection":"9(4)(c)","requirement_text":"Restrict access to ICT resources to authorised service accounts only","coverage_tier":"partially-automatable"},"dora-art9-require-sealed-secrets":{"req_id":"REQ-023","dora_article":"Art. 9","dora_subsection":"9(4)(d)","requirement_text":"Implement cryptographic key management controls","coverage_tier":"partially-automatable"},"dorasealedsecrets":{"req_id":"REQ-023","dora_article":"Art. 9","dora_subsection":"9(4)(d)","requirement_text":"Implement cryptographic key management controls","coverage_tier":"partially-automatable"},"dora-art10-require-kernel-audit":{"req_id":"REQ-005","dora_article":"Art. 10","dora_subsection":"10(1)","requirement_text":"Enable kernel-level security auditing on containers","coverage_tier":"partially-automatable"},"doraseccompaudit":{"req_id":"REQ-005","dora_article":"Art. 10","dora_subsection":"10(1)","requirement_text":"Enable kernel-level security auditing on containers","coverage_tier":"partially-automatable"},"dora-art10-require-logging":{"req_id":"REQ-020","dora_article":"Art. 10","dora_subsection":"10(3)","requirement_text":"Implement application-level log collection and forwarding","coverage_tier":"partially-automatable"},"doralogging":{"req_id":"REQ-020","dora_article":"Art. 10","dora_subsection":"10(3)","requirement_text":"Implement application-level log collection and forwarding","coverage_tier":"partially-automatable"},"dora-art11-require-resource-limits":{"req_id":"REQ-006","dora_article":"Art. 11","dora_subsection":"11(1)","requirement_text":"Ensure ICT system resilience through resource governance","coverage_tier":"fully-automatable"},"doraresourcelimits":{"req_id":"REQ-006","dora_article":"Art. 11","dora_subsection":"11(1)","requirement_text":"Ensure ICT system resilience through resource governance","coverage_tier":"fully-automatable"},"dora-art11-require-minimum-replicas":{"req_id":"REQ-007","dora_article":"Art. 11","dora_subsection":"11(1)","requirement_text":"Ensure high availability of critical ICT services","coverage_tier":"fully-automatable"},"dorareplicas":{"req_id":"REQ-007","dora_article":"Art. 11","dora_subsection":"11(1)","requirement_text":"Ensure high availability of critical ICT services","coverage_tier":"fully-automatable"},"dora-art11-require-pdb":{"req_id":"REQ-024","dora_article":"Art. 11","dora_subsection":"11(5)","requirement_text":"Implement graceful degradation capabilities","coverage_tier":"partially-automatable"},"dorapdb":{"req_id":"REQ-024","dora_article":"Art. 11","dora_subsection":"11(5)","requirement_text":"Implement graceful degradation capabilities","coverage_tier":"partially-automatable"},"dora-art13-require-change-annotation":{"req_id":"REQ-015","dora_article":"Art. 13","dora_subsection":"13(1)","requirement_text":"Implement ICT change management processes","coverage_tier":"partially-automatable"},"dorachangeannotation":{"req_id":"REQ-015","dora_article":"Art. 13","dora_subsection":"13(1)","requirement_text":"Implement ICT change management processes","coverage_tier":"partially-automatable"},"dora-art15-verify-image-signature":{"req_id":"REQ-022","dora_article":"Art. 15","dora_subsection":"15(1)","requirement_text":"Verify container image provenance and integrity","coverage_tier":"partially-automatable"},"doraimagesignature":{"req_id":"REQ-022","dora_article":"Art. 15","dora_subsection":"15(1)","requirement_text":"Verify container image provenance and integrity","coverage_tier":"partially-automatable"},"dora-art15-restrict-registries":{"req_id":"REQ-023b","dora_article":"Art. 15","dora_subsection":"15(1)","requirement_text":"Restrict container images to pre-approved registries","coverage_tier":"fully-automatable"},"doraregistries":{"req_id":"REQ-023b","dora_article":"Art. 15","dora_subsection":"15(1)","requirement_text":"Restrict container images to pre-approved registries","coverage_tier":"fully-automatable"}}'
