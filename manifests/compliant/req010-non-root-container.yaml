# TEST: Should be ALLOWED — proper non-root + drop ALL
# Targets: REQ-010 (DORA Art. 9(4)(a))
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-req010-compliant
  namespace: dora-test
  labels:
    dora.test: "true"
    dora.requirement: "REQ-010"
    dora.expected-result: "allowed"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-req010-good
  template:
    metadata:
      labels:
        app: test-req010-good
    spec:
      containers:
        - name: good-container
          image: nginx:1.27
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
