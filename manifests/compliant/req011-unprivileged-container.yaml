# TEST: Should be ALLOWED — no privileged, no host access
# Targets: REQ-011 (DORA Art. 9(4)(a))
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-req011-compliant
  namespace: dora-test
  labels:
    dora.test: "true"
    dora.requirement: "REQ-011"
    dora.expected-result: "allowed"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-req011-good
  template:
    metadata:
      labels:
        app: test-req011-good
    spec:
      hostNetwork: false
      hostPID: false
      hostIPC: false
      containers:
        - name: safe-container
          image: nginx:1.27
          securityContext:
            privileged: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
