# TEST: Should be BLOCKED — critical workload with only 1 replica
# Targets: REQ-007 (DORA Art. 11(1))
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-req007-violation
  namespace: dora-test
  labels:
    dora.test: "true"
    dora.requirement: "REQ-007"
    dora.expected-result: "denied"
    dora.io/criticality: "high"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-req007-bad
  template:
    metadata:
      labels:
        app: test-req007-bad
    spec:
      serviceAccountName: dora-test-sa
      containers:
        - name: single-replica
          image: nginx:1.27
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
