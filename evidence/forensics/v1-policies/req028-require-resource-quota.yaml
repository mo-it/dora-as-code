apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: dora-art9-require-resource-quota
  annotations:
    dora.article: "9(3)(b)"
    dora.requirement: "REQ-028"
    dora.requirement-text: "Implement logical segregation of ICT assets"
    dora.coverage: "fully-automatable"
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-quota-annotation-on-namespace
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          - resources:
              names:
                - kube-system
                - kube-public
                - kube-node-lease
                - default
                - kyverno
                - gatekeeper-system
                - argocd
      validate:
        message: >-
          DORA Art. 9(3)(b) violation [REQ-028]: Namespaces must have a
          ResourceQuota configured. Add annotation
          dora.io/resource-quota-configured: "true" after creating
          a ResourceQuota in this namespace.
        pattern:
          metadata:
            annotations:
              dora.io/resource-quota-configured: "true"
