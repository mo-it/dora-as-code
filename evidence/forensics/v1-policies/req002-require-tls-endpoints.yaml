apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: dora-art9-require-tls
  annotations:
    dora.article: "9(2)"
    dora.requirement: "REQ-002"
    dora.requirement-text: "Ensure integrity and confidentiality of data in transit"
    dora.coverage: "fully-automatable"
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-ingress-tls
      match:
        any:
          - resources:
              kinds:
                - Ingress
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kyverno
                - gatekeeper-system
                - argocd
      validate:
        message: >-
          DORA Art. 9(2) violation [REQ-002]: Ingress must configure TLS.
          All external endpoints must encrypt data in transit.
          Add spec.tls with a valid secretName and host.
        pattern:
          spec:
            tls:
              - secretName: "?*"
                hosts:
                  - "?*"
