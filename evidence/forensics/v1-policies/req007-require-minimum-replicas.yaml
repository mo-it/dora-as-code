apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: dora-art11-require-minimum-replicas
  annotations:
    dora.article: "11(1)"
    dora.requirement: "REQ-007"
    dora.requirement-text: "Ensure high availability of critical ICT services"
    dora.coverage: "fully-automatable"
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-min-two-replicas
      match:
        any:
          - resources:
              kinds:
                - Deployment
              selector:
                matchLabels:
                  dora.io/criticality: "high"
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kyverno
                - gatekeeper-system
                - argocd
      validate:
        message: >-
          DORA Art. 11(1) violation [REQ-007]: Deployments with
          criticality: high must have at least 2 replicas.
          Single-replica critical services are a continuity risk.
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.replicas }}"
                operator: LessThan
                value: 2
