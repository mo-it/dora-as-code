# TEST: Should be BLOCKED — no resource requests or limits
# Targets: REQ-006 (DORA Art. 11(1))
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-req006-violation
  namespace: dora-test
  labels:
    dora.test: "true"
    dora.requirement: "REQ-006"
    dora.expected-result: "denied"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-req006-bad
  template:
    metadata:
      labels:
        app: test-req006-bad
    spec:
      serviceAccountName: dora-test-sa
      containers:
        - name: unlimited-container
          image: nginx:1.27
          # VIOLATION: no resources block at all
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
