# TEST: Should be ALLOWED — full hardening applied
# Targets: REQ-018 (DORA Art. 9(4)(a))
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-req018-compliant
  namespace: dora-test
  labels:
    dora.test: "true"
    dora.requirement: "REQ-018"
    dora.expected-result: "allowed"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-req018-good
  template:
    metadata:
      labels:
        app: test-req018-good
    spec:
      containers:
        - name: hardened-container
          image: nginx:1.27
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
