# TEST: Should be ALLOWED — uses specific version tag
# Targets: REQ-009 (DORA Art. 9(2))
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-req009-compliant
  namespace: dora-test
  labels:
    dora.test: "true"
    dora.requirement: "REQ-009"
    dora.expected-result: "allowed"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-req009-good
  template:
    metadata:
      labels:
        app: test-req009-good
    spec:
      serviceAccountName: dora-test-sa
      containers:
        - name: pinned-container
          image: nginx:1.27.0
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
